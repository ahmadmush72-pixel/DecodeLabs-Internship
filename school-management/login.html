<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sky Hawk School Management System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <!-- Header / Navbar -->
    <header class="header">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-box">
            <svg viewBox="0 0 24 24" class="cap-icon">
              <path d="M22 10L12 5L2 10L12 15L22 10Z"></path>
              <path
                d="M6 12.5V16C6 18.8 8.7 20.5 12 20.5C15.3 20.5 18 18.8 18 16V12.5"
              ></path>
              <path d="M22 10V16"></path>
            </svg>
          </div>
          <span class="logo-text">
            <span class="text-sky">Sky</span>
            <span class="text-hawk">Hawk</span>
          </span>
        </a>

        <ul class="nav-menu" id="navMenu">
          <li class="menu-close-row">
            <button class="menu-close" id="menuClose" type="button">&times;</button>
          </li>
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="index.html#features" class="nav-link">Features</a></li>
          <li><a href="index.html#about" class="nav-link">About</a></li>
          <li><a href="index.html#contact" class="nav-link">Contact</a></li>
          <li class="menu-auth">
            <a href="register.html" class="btn-register">Register</a>
          </li>
        </ul>

        <div class="nav-buttons">
          <a href="register.html" class="btn-register">Register</a>
        </div>

        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <span class="auth-badge">Secure Portal</span>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Log in to access your Sky Hawk dashboard</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert-box"></div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              placeholder="e.g. yourname@skyhawk.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" id="submitBtn" class="form-btn">
            <span>Sign In</span>
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Register as Student</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-bottom">
        <p>&copy; 2026 Sky Hawk School Management System. All rights reserved.</p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
      // 1. If already logged in, redirect straight to their dashboard
      redirectIfLoggedIn();

      // Mobile Menu Toggle
      const hamburger = document.getElementById("hamburger");
      const navMenu = document.getElementById("navMenu");
      const menuClose = document.getElementById("menuClose");
      if (hamburger && navMenu) {
        hamburger.addEventListener("click", () => navMenu.classList.toggle("open"));
        menuClose.addEventListener("click", () => navMenu.classList.remove("open"));
      }

      // Form Handling
      const loginForm = document.getElementById('loginForm');
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      function showAlert(type, message, errorList = null) {
        alertBox.className = `alert-box alert-${type} show`;
        let content = `<strong>${message}</strong>`;
        if (errorList && Object.keys(errorList).length > 0) {
          content += '<ul>';
          for (const key in errorList) {
            content += `<li>${errorList[key].join(', ')}</li>`;
          }
          content += '</ul>';
        }
        alertBox.innerHTML = content;
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Frontend validation
        if (!email || !password) {
          showAlert('error', 'Please enter both email and password.');
          return;
        }

        // Disable button & show loading state
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Signing In...</span>';
        alertBox.className = 'alert-box';

        // Send API request
        const result = await apiRequest('/login', 'POST', { email, password });

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span>';

        if (result.ok && result.data.status) {
          const user = result.data.data.user;
          const token = result.data.data.token;

          // Store auth data securely in localStorage
          setAuth(token, user);

          showAlert('success', result.data.message || 'Login successful! Redirecting...');

          // Redirect according to role
          setTimeout(() => {
            if (user.role === 'admin') {
              window.location.href = 'admin-dashboard.html';
            } else {
              window.location.href = 'student-dashboard.html';
            }
          }, 800);
        } else {
          const message = result.data.message || 'Login failed. Please check your credentials.';
          showAlert('error', message, result.data.errors);
        }
      });
    </script>
  </body>
</html>
