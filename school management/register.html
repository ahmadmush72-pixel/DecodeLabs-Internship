<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Sky Hawk School Management System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <!-- Header / Navbar -->
    <header class="header">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-box">
            <svg viewBox="0 0 24 24" class="cap-icon">
              <path d="M22 10L12 5L2 10L12 15L22 10Z"></path>
              <path
                d="M6 12.5V16C6 18.8 8.7 20.5 12 20.5C15.3 20.5 18 18.8 18 16V12.5"
              ></path>
              <path d="M22 10V16"></path>
            </svg>
          </div>
          <span class="logo-text">
            <span class="text-sky">Sky</span>
            <span class="text-hawk">Hawk</span>
          </span>
        </a>

        <ul class="nav-menu" id="navMenu">
          <li class="menu-close-row">
            <button class="menu-close" id="menuClose" type="button">&times;</button>
          </li>
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="index.html#features" class="nav-link">Features</a></li>
          <li><a href="index.html#about" class="nav-link">About</a></li>
          <li><a href="index.html#contact" class="nav-link">Contact</a></li>
          <li class="menu-auth">
            <a href="login.html" class="btn-login">Login</a>
          </li>
        </ul>

        <div class="nav-buttons">
          <a href="login.html" class="btn-login">Login</a>
        </div>

        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="auth-wrapper">
      <div class="auth-card auth-card-wide">
        <div class="auth-header">
          <span class="auth-badge">Student Admission</span>
          <h1 class="auth-title">Student Registration</h1>
          <p class="auth-subtitle">Create your student account to access the Sky Hawk portal</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="alert-box"></div>

        <!-- Registration Form -->
        <form id="registerForm" novalidate>
          <!-- User Base Info -->
          <div class="form-row">
            <div class="form-group">
              <label for="name">Full Name *</label>
              <input type="text" id="name" placeholder="e.g. Mushtaq Ahmad" required />
            </div>
            <div class="form-group">
              <label for="email">Email Address *</label>
              <input type="email" id="email" placeholder="e.g. student@skyhawk.com" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password (min 6 characters) *</label>
              <input type="password" id="password" placeholder="Create password" required />
            </div>
            <div class="form-group">
              <label for="password_confirmation">Confirm Password *</label>
              <input type="password" id="password_confirmation" placeholder="Confirm password" required />
            </div>
          </div>

          <!-- Student Profile Fields (Active by default for students) -->
          <div id="studentFields">
            <div class="form-row">
              <div class="form-group">
                <label for="phone">Student Contact Phone</label>
                <input type="text" id="phone" placeholder="e.g. +92 300 1234567" />
              </div>
              <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" id="date_of_birth" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="grade_level">Grade / Class Level</label>
                <select id="grade_level">
                  <option value="Grade 9">Grade 9</option>
                  <option value="Grade 10" selected>Grade 10</option>
                  <option value="Grade 11">Grade 11</option>
                  <option value="Grade 12">Grade 12</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="section">Section</label>
                <input type="text" id="section" placeholder="e.g. A" value="A" />
              </div>
              <div class="form-group">
                <label for="parent_name">Guardian / Parent Name</label>
                <input type="text" id="parent_name" placeholder="e.g. Ahmad Khan" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="parent_phone">Guardian Contact Phone</label>
                <input type="text" id="parent_phone" placeholder="e.g. +92 300 7654321" />
              </div>
              <div class="form-group">
                <label for="address">Residential Address</label>
                <input type="text" id="address" placeholder="e.g. Swat, Pakistan" />
              </div>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="form-btn">
            <span>Create Account</span>
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-bottom">
        <p>&copy; 2026 Sky Hawk School Management System. All rights reserved.</p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
      redirectIfLoggedIn();

      // Mobile Menu
      const hamburger = document.getElementById("hamburger");
      const navMenu = document.getElementById("navMenu");
      const menuClose = document.getElementById("menuClose");
      if (hamburger && navMenu) {
        hamburger.addEventListener("click", () => navMenu.classList.toggle("open"));
        menuClose.addEventListener("click", () => navMenu.classList.remove("open"));
      }

      // Form Handling
      const registerForm = document.getElementById('registerForm');
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      function showAlert(type, message, errorList = null) {
        alertBox.className = `alert-box alert-${type} show`;
        let content = `<strong>${message}</strong>`;
        if (errorList && Object.keys(errorList).length > 0) {
          content += '<ul>';
          for (const key in errorList) {
            content += `<li>${errorList[key].join(', ')}</li>`;
          }
          content += '</ul>';
        }
        alertBox.innerHTML = content;
      }

      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const password_confirmation = document.getElementById('password_confirmation').value;

        // Frontend Validation
        if (!name || !email || !password || !password_confirmation) {
          showAlert('error', 'Please fill in all required fields marked with *.');
          return;
        }

        if (password.length < 6) {
          showAlert('error', 'Password must be at least 6 characters long.');
          return;
        }

        if (password !== password_confirmation) {
          showAlert('error', 'Passwords do not match. Please re-enter.');
          return;
        }

        const payload = {
          name,
          email,
          password,
          password_confirmation,
          role: 'student',
          phone: document.getElementById('phone').value.trim() || null,
          date_of_birth: document.getElementById('date_of_birth').value || null,
          gender: document.getElementById('gender').value,
          grade_level: document.getElementById('grade_level').value,
          section: document.getElementById('section').value.trim() || 'A',
          parent_name: document.getElementById('parent_name').value.trim() || null,
          parent_phone: document.getElementById('parent_phone').value.trim() || null,
          address: document.getElementById('address').value.trim() || null,
        };

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Creating Account...</span>';
        alertBox.className = 'alert-box';

        const result = await apiRequest('/register', 'POST', payload);

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Create Account</span>';

        if (result.ok && result.data.status) {
          const user = result.data.data.user;
          const token = result.data.data.token;

          setAuth(token, user);

          showAlert('success', result.data.message || 'Registration successful! Redirecting to student portal...');

          setTimeout(() => {
            window.location.href = 'student-dashboard.html';
          }, 900);
        } else {
          const message = result.data.message || 'Registration failed.';
          showAlert('error', message, result.data.errors);
        }
      });
    </script>
  </body>
</html>
